<title>Sugar and Fruits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: fruit-market stall. Striped awning on the welcome screen, one big illustrated card per screen, sticky nav with progress bar. */
:root{
  --bg:#FFF6E0; --card:#FFFDF6; --ink:#33291F; --muted:#7A6A55; --line:#EBD9B0;
  --green:#4FB26B; --green-d:#2B8A4B; --orange:#FF9A3C; --orange-ink:#3A1D00;
  --pink:#FF6F91; --yellow:#FFD23F; --cream:#FFF1C9;
  --ok-bg:#DDF4E2; --ok-ink:#17603A; --no-bg:#FFE5D3; --no-ink:#8F3507;
  --shadow:0 6px 0 rgba(120,90,40,.16);
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1913; --card:#2B241B; --ink:#FFF3DA; --muted:#CDBA93; --line:#4B3E2B;
    --green:#5CC47A; --green-d:#1F7A41; --orange:#FFA74F; --orange-ink:#2E1600;
    --pink:#FF86A3; --yellow:#FFD84F; --cream:#3A3022;
    --ok-bg:#1F4A2D; --ok-ink:#BDF2CB; --no-bg:#573019; --no-ink:#FFD2B0;
    --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1913; --card:#2B241B; --ink:#FFF3DA; --muted:#CDBA93; --line:#4B3E2B;
  --green:#5CC47A; --green-d:#1F7A41; --orange:#FFA74F; --orange-ink:#2E1600;
  --pink:#FF86A3; --yellow:#FFD84F; --cream:#3A3022;
  --ok-bg:#1F4A2D; --ok-ink:#BDF2CB; --no-bg:#573019; --no-ink:#FFD2B0;
  --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;font-size:clamp(17px,1.5vw,22px);line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--orange);outline-offset:3px;border-radius:12px}
.wrap{max-width:1120px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding:12px 0 10px}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.homebtn{border:3px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-family:var(--display);font-weight:600;box-shadow:var(--shadow)}
.steps{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.chip{border:3px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:500;font-size:.9em;color:var(--muted)}
.chip.on{background:var(--green-d);border-color:var(--green-d);color:#fff}
.chip.dn{border-color:var(--green);color:var(--ink)}
.bar{height:12px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--orange));border-radius:99px;transition:width .5s ease}

/* cards + buttons */
.card{background:var(--card);border:3px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(18px,3vw,36px)}
.btn{border:0;border-radius:999px;padding:14px 30px;font-family:var(--display);font-weight:600;font-size:1.15em;background:var(--green-d);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.alt{background:var(--orange);color:var(--orange-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}
.navrow{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:22px}
.navrow .mid{color:var(--muted);font-family:var(--display);font-weight:500}
.es{color:var(--muted);font-weight:700}
.sectitle{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:16px}
.sectitle h2{font-size:clamp(1.6rem,3.2vw,2.4rem)}

/* welcome */
.hero{padding:0;overflow:hidden}
.awning{height:46px;background:repeating-linear-gradient(90deg,var(--green) 0 44px,var(--cream) 44px 88px);
  -webkit-mask:linear-gradient(#000,#000) top/100% 22px no-repeat,radial-gradient(circle at 22px 0,#000 22px,transparent 22.5px) 0 22px/44px 24px repeat-x;
  mask:linear-gradient(#000,#000) top/100% 22px no-repeat,radial-gradient(circle at 22px 0,#000 22px,transparent 22.5px) 0 22px/44px 24px repeat-x}
.herobody{padding:clamp(18px,3vw,40px);text-align:center;display:grid;gap:18px;justify-items:center}
.herobody h1{font-size:clamp(2.6rem,8vw,5.6rem);color:var(--green-d)}
.herobody h1 span{color:var(--pink)}
.fruitrow{display:flex;gap:clamp(4px,1.4vw,16px);flex-wrap:wrap;justify-content:center}
.fruitrow .mini{width:clamp(56px,9vw,104px);aspect-ratio:1}
.fruitrow .mini:nth-child(odd){animation:bob 3s ease-in-out infinite}
.fruitrow .mini:nth-child(even){animation:bob 3s ease-in-out -1.5s infinite}
.startbtn{font-size:1.6em;padding:18px 44px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:100%;margin-top:8px}
.menu button{border:3px solid var(--line);background:var(--bg);border-radius:20px;padding:14px;text-align:left;display:grid;gap:2px}
.menu button b{font-family:var(--display);font-size:1.15em}
.menu button:hover{border-color:var(--green)}

/* vocab */
.vocab{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(16px,3vw,40px);align-items:center}
.pic{border-radius:28px;aspect-ratio:1;max-height:min(58vh,520px);width:100%;display:grid;place-items:center;background:rgba(var(--t),.3);border:3px solid rgba(var(--t),.7);margin:0 auto}
.pic svg{width:80%;height:80%;animation:bob 3.4s ease-in-out infinite}
.word{font-family:var(--display);font-weight:700;font-size:clamp(2.8rem,8vw,6rem);line-height:1;letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.trans{font-family:var(--display);font-weight:500;font-size:clamp(1.8rem,4vw,3rem);color:var(--muted)}
.tag{display:inline-block;border-radius:999px;padding:4px 16px;font-family:var(--display);font-weight:600;font-size:.85em}
.tag.fruit{background:var(--ok-bg);color:var(--ok-ink)}
.tag.sugar{background:var(--no-bg);color:var(--no-ink)}
.say{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.speaker{width:78px;height:78px;border-radius:50%;border:0;background:var(--orange);color:var(--orange-ink);font-size:2.1rem;box-shadow:0 5px 0 rgba(0,0,0,.2);flex:none}
.speaker.talk{animation:pulse .6s ease 2}
.phon{font-family:var(--display);font-weight:500;color:var(--muted)}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--orange);transform:scale(1.35)}
.dots i.dn{background:var(--green)}
.grid9{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{border:3px solid var(--line);border-radius:22px;padding:10px;display:grid;justify-items:center;gap:4px;background:var(--bg);text-align:center}
.tile .mini{width:min(110px,60%);aspect-ratio:1}
.tile b{font-family:var(--display);font-size:1.25em;text-transform:uppercase}
.tile button{border:0;background:none;font-size:1.5rem;padding:0 8px}
.note{background:var(--cream);border-radius:20px;padding:14px 20px;margin-top:18px}

/* quiz */
.qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.score{font-family:var(--display);font-weight:600;background:var(--yellow);color:#3A2A00;border-radius:999px;padding:6px 18px}
.qbody{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(16px,3vw,36px);align-items:center}
.qbody .pic{max-height:min(44vh,400px)}
.qtext{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3.6vw,2.6rem);line-height:1.15;margin-bottom:16px}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:4px solid var(--line);background:var(--bg);border-radius:22px;padding:16px 20px;font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,3vw,2.1rem);text-align:left;transition:transform .12s,border-color .12s}
.opts.two .opt{text-align:center;padding:26px 12px}
.opt:hover:not([disabled]){border-color:var(--orange);transform:translateY(-2px)}
.opt.ok{background:var(--ok-bg);border-color:var(--green-d);color:var(--ok-ink);animation:pop .5s}
.opt.no{background:var(--no-bg);border-color:var(--orange);color:var(--no-ink);opacity:.8}
.opt[disabled]{cursor:default}
.fb{min-height:3.4em;margin-top:16px;border-radius:20px;padding:12px 18px;font-family:var(--display);font-weight:600;font-size:clamp(1.2rem,2.6vw,1.7rem);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink)}
.fb.no{background:var(--no-bg);color:var(--no-ink)}
.fb.idle{background:transparent;color:var(--muted);font-weight:500}
.fb .speaker{width:48px;height:48px;font-size:1.3rem}
.result{text-align:center;display:grid;gap:14px;justify-items:center}
.big{font-family:var(--display);font-weight:700;font-size:clamp(3rem,10vw,6rem);color:var(--green-d);line-height:1}
.stars{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:.1em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;text-align:left}
.col{border-radius:24px;padding:16px 20px;border:3px solid}
.col.fruit{background:var(--ok-bg);border-color:var(--green);color:var(--ok-ink)}
.col.sugar{background:var(--no-bg);border-color:var(--orange);color:var(--no-ink)}
.col h3{font-size:1.5em;margin-bottom:8px}
.col ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.col li{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.25em}
.col li .mini{width:44px;height:44px;flex:none}
.reflect{width:100%;text-align:left}
.reflect ol{margin:8px 0 0;padding-left:1.3em;display:grid;gap:6px;font-family:var(--display);font-weight:500;font-size:1.25em}
.model{color:var(--muted);font-size:.85em;font-family:var(--body);font-weight:700}

/* homework */
.hw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,3vw,32px)}
.hw ol{padding-left:1.2em;margin:10px 0;display:grid;gap:8px}
.blank{display:inline-block;min-width:5.5em;border-bottom:4px solid var(--orange);margin:0 4px}
.sheet{background:var(--bg);border:3px dashed var(--line);border-radius:22px;padding:18px;display:grid;gap:12px}
.sheet .label{font-family:var(--display);font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:.8em}
.row5{display:flex;gap:10px;flex-wrap:wrap}
.polaroid{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:6px 6px 8px;text-align:center;width:calc(20% - 8px);min-width:84px;flex:1 1 84px;transform:rotate(-2deg)}
.polaroid:nth-child(even){transform:rotate(2deg)}
.polaroid .mini{width:100%;aspect-ratio:1}
.polaroid b{font-family:var(--display);font-size:.95em}
.sentence{font-family:var(--display);font-weight:500;font-size:1.2em}
.sentence u{text-decoration:none;border-bottom:4px solid var(--green);font-weight:700;color:var(--green-d)}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px))}
.overlay .inner{max-width:1100px;margin:0 auto;display:grid;gap:22px}
.overlay h2{font-size:clamp(2.4rem,6vw,4.6rem);color:var(--green-d)}
.overlay .sentence{font-size:clamp(1.6rem,3.6vw,2.8rem)}
.overlay li{font-size:clamp(1.4rem,3vw,2.4rem);font-family:var(--display);font-weight:500}
.close{justify-self:end}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 20px;z-index:60;font-family:var(--display);font-weight:500;max-width:90vw;text-align:center}

@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen{animation:rise .35s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){
  .vocab,.qbody,.hw,.cols{grid-template-columns:1fr}
  .opts.two{grid-template-columns:1fr 1fr}
  .steps{justify-content:flex-start}
  .chip{padding:4px 10px}
  .navrow .btn{flex:1 1 40%;padding-inline:14px}
  .pic{max-width:340px}
}
</style>

<div class="top"><div class="wrap">
  <div class="toprow">
    <button class="homebtn" data-act="go" data-to="welcome" aria-label="Home">🏠 Home</button>
    <nav class="steps" id="steps" aria-label="Sections"></nav>
  </div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="barfill" style="width:0%"></i></div>
</div></div>
<main class="wrap" id="app" style="padding-top:12px"></main>
<div id="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

var voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  var vs=speechSynthesis.getVoices()||[];
  voice=vs.filter(function(v){return /^en[-_]US/i.test(v.lang);})[0]||vs.filter(function(v){return /^en/i.test(v.lang);})[0]||null;
}

function speak(id,btn){
  var f=BY[id];if(!f)return;
  if(btn){btn.classList.remove('talk');void btn.offsetWidth;btn.classList.add('talk');}
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('No audio here. Read it: '+f.ph);return;}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(f.en);u.lang='en-US';u.rate=.8;
    if(voice)u.voice=voice;
    u.onerror=function(){toast('No audio here. Read it: '+f.ph);};
    speechSynthesis.speak(u);
  }catch(e){toast('No audio here. Read it: '+f.ph);}
}

var A={

  next1:function(){S.i1++;render();},
  pick:function(d){
    var Q=S.q,q=QUIZ[Q.i];
    if(Q.state==='right'||Q.state==='reveal')return;
    var o=Q.opts[+d.i];Q.attempts++;
    if(o===q.a){Q.ok=o;Q.state='right';Q.score++;}
    else{Q.wrong.push(o);Q.state=Q.attempts>=2?'reveal':'retry';if(Q.state==='reveal')Q.ok=q.a;}
    render();
  },
  qnext:function(){
    var Q=S.q;
    if(Q.i>=7){Q.done=true;S.quizScore=Q.score;render();top();return;}
    Q.i++;Q.attempts=0;Q.state='ask';Q.wrong=[];Q.ok=null;Q.opts=shuffle(QUIZ[Q.i].opts);render();
  },
  qrestart:function(){newQuiz();render();top();},
  cpick:function(d){
    var C=S.c;if(C.state!=='ask')return;
    var f=BY[C.order[C.i]];C.picked=d.t;
